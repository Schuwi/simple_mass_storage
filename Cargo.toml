[workspace]
members = ["crates/zx0-decompress"]

[package]
name = "simple_mass_storage"
version = "0.1.0"
authors = ["Schuwi <schuwi4@gmail.com>"]
edition = "2021"

[dependencies]
zx0-decompress = { path = "crates/zx0-decompress", features = ["defmt"] }
# "critical-section-single-core" needed for static_cell crate
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-probe = { version = "0.3.1", features = ["defmt"] }
rtic = { version = "2", features = ["thumbv7-backend"] }
defmt-rtt = "1.2.0"
defmt = "1.1.0"
static_cell = "2.1.1"
usb-device = "0.3.2"
usbd-storage = { version = "2.0.0", features = ["bbb", "defmt", "scsi"] }
stm32-device-signature = { version = "0.3.3", features = ["stm32f4"] }

[dependencies.stm32f4xx-hal]
version = "0.23.0"
features = ["stm32f401", "rtic2", "defmt", "usb_fs"]


[build-dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
# Builds the embedded FAT image from `assets/` at compile time (see build.rs /
# build/fat_image.rs). `chrono` is disabled on purpose so the default time
# provider is `NullTimeProvider`, keeping the generated image reproducible.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
# ZX0 (v2) compressor: the image is split into fixed-size chunks, each compressed
# independently, so the firmware can decompress one chunk at a time on demand.
zx0 = "1.0.0"
# The firmware's own decompressor, used at build time to verify each compressed
# chunk decodes back to the original before it is embedded. No `defmt` here (host
# build); the firmware enables that feature in [dependencies].
zx0-decompress = { path = "crates/zx0-decompress" }


# Set the default for dependencies.
[profile.dev.package."*"]
opt-level = "s"

# Optimize the build script and its dependencies (notably the `zx0` compressor,
# which is extremely slow when built unoptimized) so image compression at build
# time is fast in every profile. Built once, then cached.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3

[profile.release]
codegen-units = 1
incremental = false
debug = true
lto = true
opt-level = "s"
