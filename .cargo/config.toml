[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32F401RETx"

rustflags = [
  # LLD (shipped with the Rust toolchain) is used as the default linker
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  # "-C", "link-arg=-Tstlog.x",

  # if you run into problems with LLD switch to the GNU linker by commenting out
  # this line
  # "-C", "linker=arm-none-eabi-ld",

  # if you need to link to pre-compiled C libraries provided by a C toolchain
  # use GCC as the linker by commenting out both lines above and then
  # uncommenting the three lines below
  # "-C", "linker=arm-none-eabi-gcc",
  # "-C", "link-arg=-Wl,-Tlink.x",
  # "-C", "link-arg=-nostartfiles",
]

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"
CHIPSERIE = "stm32f401"

[alias]
# Run the host-side tests for the zx0-decompress lib crate (the workspace
# otherwise defaults to the embedded target, which can't run tests).
test-zx0 = "test -p zx0-decompress --target x86_64-unknown-linux-gnu"
# Host-side SEGGER vendoring helper (see xtask/, docs/SEGGER_SETUP.md). The
# explicit host target overrides the firmware's default `thumbv7em` target;
# non-Linux hosts substitute their own triple (e.g. aarch64-apple-darwin).
xtask = "run --manifest-path xtask/Cargo.toml --target x86_64-unknown-linux-gnu --release --"
